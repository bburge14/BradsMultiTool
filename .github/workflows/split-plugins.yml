# Builds each of Snuffy's plugins from this repository (scripts/split_plugins.py), checks each compiles on
# its own, and pushes it to its own repository, which the Plugin Hub builds from. Runs on every push to main
# and on demand. Needs a SNUFFYS_PUSH_TOKEN secret: a fine-grained token with Contents read/write on the
# five plugin repositories (docs/DEVELOPMENT.md "Publishing the separate plugins").
name: Split plugins

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build and check each plugin
        run: python3 scripts/split_plugins.py --verify

      - name: Push to the plugin repositories
        env:
          TOKEN: ${{ secrets.SNUFFYS_PUSH_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "No SNUFFYS_PUSH_TOKEN secret yet; built and checked the plugins but pushed nothing."
            exit 0
          fi
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for dir in build/split/*/; do
            repo=$(grep -o "rootProject.name = '[^']*'" "$dir/settings.gradle" | cut -d"'" -f2)
            rm -rf "/tmp/$repo"
            git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/${OWNER}/${repo}.git" "/tmp/$repo"
            # Replace everything but the repository's own history
            find "/tmp/$repo" -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
            cp -a "$dir". "/tmp/$repo/"
            cd "/tmp/$repo"
            git add -A
            if git diff --cached --quiet; then
              echo "$repo: no changes"
            else
              git commit -q -m "Update from bradsmultitool@${SOURCE_SHA}"
              git push -q origin HEAD
              echo "$repo: pushed"
            fi
            cd - > /dev/null
          done
