# Builds each of Snuffy's plugins from main (scripts/split_plugins.py), checks each compiles on its own, and
# pushes each to its own branch in this repository (plugin/toolbelt, plugin/skilling-helper, ...), which the
# Plugin Hub builds from. Then writes each plugin's Plugin Hub file, naming the commit just pushed. Runs on
# every push to main and on demand (docs/DEVELOPMENT.md "Publishing the separate plugins").
name: Split plugins

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build and check each plugin
        run: python3 scripts/split_plugins.py --verify

      - name: Push each plugin to its branch
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          mkdir -p build/plugin-hub
          for dir in build/split/*/; do
            plugin=$(basename "$dir")
            read -r branch name < <(python3 scripts/split_plugins.py --info "$plugin")
            work="/tmp/plugin-$plugin"
            rm -rf "$work" && mkdir -p "$work"
            git -C "$work" init -q
            git -C "$work" config user.name "github-actions[bot]"
            git -C "$work" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git -C "$work" remote add origin "https://x-access-token:${TOKEN}@github.com/${REPO}.git"
            # Build on the branch's history if it exists, else start it
            if git -C "$work" fetch -q --depth 1 origin "$branch" 2>/dev/null; then
              git -C "$work" checkout -q -b "$branch" FETCH_HEAD
            else
              git -C "$work" checkout -q --orphan "$branch"
            fi
            find "$work" -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
            cp -a "$dir". "$work/"
            git -C "$work" add -A
            if git -C "$work" diff --cached --quiet; then
              echo "$branch: no changes"
            else
              git -C "$work" commit -q -m "Update from main@${SOURCE_SHA}"
              git -C "$work" push -q origin "HEAD:refs/heads/$branch"
              echo "$branch: pushed"
            fi
            # Its Plugin Hub file (plugins/<name> in runelite/plugin-hub), naming the commit just pushed
            python3 scripts/split_plugins.py --hub-entry "$plugin" "$(git -C "$work" rev-parse HEAD)" > "build/plugin-hub/$name"
          done

      - name: Keep the Plugin Hub files
        uses: actions/upload-artifact@v4
        with:
          name: plugin-hub-entries
          path: build/plugin-hub/
