plugins {
    id 'java'
}

repositories {
    mavenLocal()
    maven {
        url = 'https://repo.runelite.net'
        content {
            includeGroupByRegex("net\\.runelite.*")
        }
    }
    mavenCentral()
}

def runeLiteVersion = 'latest.release'

dependencies {
    compileOnly group: 'net.runelite', name: 'client', version: runeLiteVersion
    compileOnly 'org.projectlombok:lombok:1.18.30'
    annotationProcessor 'org.projectlombok:lombok:1.18.30'

    testImplementation group: 'net.runelite', name: 'client', version: runeLiteVersion
    testImplementation group: 'net.runelite', name: 'jshell', version: runeLiteVersion
    testImplementation 'junit:junit:4.13.2'
    testCompileOnly 'org.projectlombok:lombok:1.18.30'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.30'
}

group = 'com.bradsmultitool'
version = '1.0.0'

// Compile and run with JDK 17 no matter which Java is on PATH / JAVA_HOME.
// Gradle finds an installed JDK 17 automatically, or downloads one if none exists.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release.set(11)
}

// Launches a RuneLite developer client with this plugin side-loaded.
tasks.register('runBrad', JavaExec) {
    group = 'application'
    description = "Run RuneLite with Snuffy's Toolbelt loaded"
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.bradsmultitool.BradsMultiToolPluginTest'
    args = ['--developer-mode', '--debug']
    jvmArgs = ['-ea']
}

tasks.register('slayerPreview', JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.bradsmultitool.SlayerCardPreview'
    args = [System.getProperty('out', 'build/slayer-preview.png')]
    jvmArgs = ['-Djava.awt.headless=true']
}

tasks.register('headerPreview', JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.bradsmultitool.HeaderPreview'
    args = [System.getProperty('out', 'build/header-preview.png')]
    jvmArgs = ['-Djava.awt.headless=true']
}
